name: CI & TransitEngine Test Suite

on:
  push:
    branches: [ main, master, develop, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Runs daily at 00:00 UTC to maintain active contribution checks & verify GTFS feeds
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  python-gateway-test:
    name: Python Gateway & RAPTOR Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile GTFS Data
        run: |
          python telemetry/gtfs_compiler.py

      - name: Run Test Suite
        run: |
          pytest gateway/test_main.py -v

  cpp-engine-build:
    name: C++20 Core Engine Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install C++ Build Tools & Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libhiredis-dev

      - name: Configure CMake
        run: |
          cmake -B build -S core -DCMAKE_BUILD_TYPE=Release

      - name: Build Core Microservice
        run: |
          cmake --build build --config Release --parallel $(nproc)
