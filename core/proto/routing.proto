syntax = "proto3";

package transit;

service RoutingEngine {
  rpc GetEarliestArrival(RouteRequest) returns (RouteResponse);
}

message RouteRequest {
  uint32 source_stop     = 1;
  uint32 target_stop     = 2;
  uint32 departure_time  = 3;
}

message Leg {
  uint32 board_stop   = 1;
  uint32 alight_stop  = 2;
  uint32 route_id     = 3;
  uint32 board_time   = 4;
  uint32 alight_time  = 5;
}

message RouteResponse {
  repeated Leg itinerary = 1;
  bool success           = 2;
}
