[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-engine"
version = "2.5.0"
description = "High-performance RAPTOR transit routing engine, GTFS-RT telemetry simulator, and API gateway."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "websockets>=12.0",
]

[project.scripts]
transit-cli = "cli.transit_cli:main"
transit-benchmark = "tools.benchmark_engine:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["gateway", "telemetry", "tools", "cli"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | __pycache__
  | proto
  | routing_pb2\.py
  | routing_pb2_grpc\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*_pb2.py", "*_pb2_grpc.py", ".venv/*", "build/*"]

[tool.coverage.run]
source = ["gateway", "telemetry", "tools", "cli"]
omit = [
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*/test_*.py",
    "*/__pycache__/*",
    "gateway/win_proxy.py",
    "gateway/tcp_relay.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass"
]
